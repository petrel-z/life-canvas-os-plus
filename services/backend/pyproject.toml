[project]
name = "life-canvas-backend"
version = "0.0.0"
description = "Life Canvas HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.128,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0.46,<2.1",
  "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
markers = ["integration: requires TEST_DATABASE_URL and creates isolated temporary PostgreSQL databases"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
